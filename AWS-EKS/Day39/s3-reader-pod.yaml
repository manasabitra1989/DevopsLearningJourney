apiVersion: v1
kind: Pod
metadata:
  name: s3-reader-demo
  namespace: dev
  labels:
    app: s3-reader-demo
spec:
  serviceAccountName: s3-reader-sa
  containers:
    - name: aws-cli
      image: amazon/aws-cli:latest
      command:
        - /bin/sh
        - -c
        - |
          echo "IRSA ServiceAccount demonstration"
          echo "ServiceAccount: s3-reader-sa"
          sleep 86400
  restartPolicy: Never
