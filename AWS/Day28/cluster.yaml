apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: devops-day28-eks
  region: ap-south-1
  version: "1.37"

vpc:
  nat:
    gateway: Disable
  clusterEndpoints:
    publicAccess: true
    privateAccess: true

managedNodeGroups:
  - name: day28-workers
    instanceType: t3.medium
    desiredCapacity: 1
    minSize: 1
    maxSize: 1
    volumeSize: 20
    privateNetworking: false
    ssh:
      allow: false
